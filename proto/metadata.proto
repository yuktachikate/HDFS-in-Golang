syntax = "proto3";
option go_package = "./messages";

message FileMetaData {
  string file_name = 1;
  uint64 file_size = 2;
  uint64 total_chunks = 3;
  uint64 chunk_size = 4;
  string checksum = 5;
  RequestType requestType = 6;
  repeated chunkStorageLocations locations = 7;
  string sender_addr = 8;
  string receiver_addr = 9;
  string file_extension = 10;
  string folder_name = 11;
}

message chunkStorageLocations{
  string chunk_filename = 1;
  repeated string replicas = 2;
}


message ChunkMetaData {
  string file_name = 1;
  chunkStorageLocations locations = 2;
  uint64 chunk_size = 3;
  string checksum = 4;
  RequestType requestType = 7;
  string sender_addr = 8;
  string receiver_addr = 9;
  string file_extension = 10;
}

enum RequestType {
  Replica = 0;
  Write = 1;
  Read = 2;
  Delete = 3;
  FOLDER_INFO = 4;
}


message StorageNodesMetadata {
  uint64 available_space = 1;
  uint64 total_number_of_storage_requests = 2;
  string addr = 3;
  repeated ChunkFileInfo files = 4;
  RequestType request_type = 5;
  string sender_addr = 8;
  string receiver_addr = 9;
}

message ChunkFileInfo{
  string filename = 1;
  string chunk_filename = 2;
  string chunk_filepath = 3;
}

message Response{
  MsgType msg_type = 1;
  string description = 2;
}

enum MsgType{
  SUCCESS = 0;
  ERROR = 1;
}

message Request{
  RequestType request_type = 1;
  string description = 2;
  string sender_addr = 8;
  string receiver_addr = 9;
}

message Wrapper {
  oneof msg {
    FileMetaData file_metadata = 1;
    ChunkMetaData chunk_metadata = 2;
    StorageNodesMetadata storage_nodes_metadata = 3;
    Response response = 4;
    Request request = 5;
  }
}